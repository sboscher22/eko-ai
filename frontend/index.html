<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eko AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🤖 Eko AI</h1>

        <div id="chat">
            <div class="message eko">
                Bonjour ! Je suis Eko. Comment puis-je t'aider ?
            </div>
        </div>

        <form id="chat-form">
            <input
                id="message"
                type="text"
                placeholder="Écris ton message..."
                autocomplete="off"
            >

            <button type="submit">
                Envoyer
            </button>
        </form>

    </div>

    <script src="app.js"></script>

</body>
</html>
